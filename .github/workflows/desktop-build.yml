name: Build desktop (mac / win / linux)

# Manual runs produce downloadable artifacts; pushing a tag like v0.13.0 also
# attaches the installers to a GitHub Release. Each runner builds its OWN platform
# natively and jlinks its OWN bundled JRE into resources/jre (gitignored), so the
# existing extraResources mapping (resources/jre -> jre) needs no change.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for the tag build to create the GitHub Release

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            ebflag: --mac --arm64
          - os: windows-latest
            platform: win
            ebflag: --win
          - os: ubuntu-latest
            platform: linux
            ebflag: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # minima.jar is Java 8 bytecode, so any modern JRE runs it. Temurin 21 LTS is
      # available on all three runners; we jlink a minimal JRE from it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build bundled JRE (jlink)
        shell: bash
        run: |
          jlink \
            --add-modules java.se,jdk.unsupported,jdk.httpserver \
            --strip-debug --no-header-files --no-man-pages --compress=2 \
            --output resources/jre
          ls resources/jre/bin

      - name: Install deps
        run: npm ci

      - name: Verify RPC bridge
        run: npm run test:rpc

      # The SSRF guard. Token metadata is attacker-supplied and the wallet fetches icons automatically, so a
      # regression here is a `send` from a picture (see scripts/netfetch-test.cjs). Never let it build unproven.
      - name: Verify SSRF guard
        run: npm run test:netfetch

      # The update channel is the one path that puts an executable in front of the user.
      - name: Verify updater guards
        run: npm run test:updater

      # Every key the renderer persists must be declared in config DEFAULTS. save() drops the ones it does not
      # know, silently — which is exactly how the Casino currency toggle died between 0.16.97 and 0.16.99.
      - name: Verify config keys
        run: npm run test:config-keys

      - name: Verify Parlons panel sessions
        run: npm run test:parlons

      # The node's stdout on disk (rotated). The line that explained a lost swap lived only in a RAM ring.
      - name: Verify node log file
        run: npm run test:node-log

      # minimaMail: the Android-shared backup container, the thread key both peers must agree on, the
      # pay-address guard, and the scan depth that decides how much history we fetch.
      - name: Verify mail invariants
        run: npm run test:mail

      # Engine parity + fund-safety gate. main/pandapools/*.js is copied verbatim from the pandapools-mds
      # MiniDapp; that donor repo is not checked out here, so this verifies the COMMITTED digest manifest rather
      # than the donor tree (scripts/pandapools-parity-check.cjs does the donor comparison locally, before a
      # release). Runs on all three matrix legs, so it also catches line-ending corruption of the copied files.
      # Placed BEFORE the build so a drifted engine can never produce an installer.
      - name: Verify PandaPools engine parity + recovery
        run: npm run test:pandapools

      # The donor-free halves of the other suites. The parity checks in test:atomix / test:casino diff against
      # donor repos that CI does not check out, but the units and gates below need nothing external — and they
      # cover fund-safety surfaces (the ETH RPC SSRF allowlist is 136 of these checks). Leaving them out meant
      # a regression that reopened that allowlist could ship three installers with nothing going red.
      - name: Verify ETH wallet guards
        run: npm run test:ethwallet

      # NOT gate:atomix — the S1/S2 gates boot the engine against a live mainnet node in the minimega docker
      # container and compare the derived ETH identity with that peer's. There is no such node here, so they
      # stay a local pre-release step. atomix-unit skips its one container-dependent check and says so.
      - name: Verify AtomiX glue
        run: node scripts/atomix-unit.js

      - name: Verify Casino glue
        run: node scripts/casino-glue-test.js

      - name: Verify terminal autocomplete
        run: npm run test:termcomplete

      # The Parlons Node jar is never in git: the newest node-v* release of eurobuddha/maxima, checksum-verified.
      - name: Fetch parlons-node.jar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-parlons-node-jar.sh

      - name: Build installer
        shell: bash
        run: npx electron-builder ${{ matrix.ebflag }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minimacore-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
