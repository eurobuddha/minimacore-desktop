name: Build desktop (mac / win / linux)

# Manual runs produce downloadable artifacts; pushing a tag like v0.13.0 also
# attaches the installers to a GitHub Release. Each runner builds its OWN platform
# natively and jlinks its OWN bundled JRE into resources/jre (gitignored), so the
# existing extraResources mapping (resources/jre -> jre) needs no change.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for the tag build to create the GitHub Release

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            ebflag: --mac --arm64
          - os: windows-latest
            platform: win
            ebflag: --win
          - os: ubuntu-latest
            platform: linux
            ebflag: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # minima.jar is Java 8 bytecode, so any modern JRE runs it. Temurin 21 LTS is
      # available on all three runners; we jlink a minimal JRE from it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build bundled JRE (jlink)
        shell: bash
        run: |
          jlink \
            --add-modules java.se,jdk.unsupported,jdk.httpserver \
            --strip-debug --no-header-files --no-man-pages --compress=2 \
            --output resources/jre
          ls resources/jre/bin

      - name: Install deps
        run: npm ci

      - name: Verify RPC bridge
        run: npm run test:rpc

      # The SSRF guard. Token metadata is attacker-supplied and the wallet fetches icons automatically, so a
      # regression here is a `send` from a picture (see scripts/netfetch-test.cjs). Never let it build unproven.
      - name: Verify SSRF guard
        run: npm run test:netfetch

      # The update channel is the one path that puts an executable in front of the user.
      - name: Verify updater guards
        run: npm run test:updater

      # Every key the renderer persists must be declared in config DEFAULTS. save() drops the ones it does not
      # know, silently (the 0.16.97 regression).
      - name: Verify config keys
        run: npm run test:config-keys

      - name: Verify Parlons panel sessions
        run: npm run test:parlons

      # The node's stdout on disk (rotated). The line that explained a lost swap lived only in a RAM ring.
      - name: Verify node log file
        run: npm run test:node-log

      # minimaMail: the Android-shared backup container, the thread key both peers must agree on, the
      # pay-address guard, and the scan depth that decides how much history we fetch.
      - name: Verify mail invariants
        run: npm run test:mail

      # A command the app builds is one command: no ";" from a pasted seed, a peer or the chain starts a second one.
      - name: Verify no command injection
        run: npm run test:inject

      # A file the node is told to read (a backup, a MegaMMR file): chosen in the open dialog, checked, quoted; one command, no password echoed.
      - name: Verify file import
        run: npm run test:import

      # Every text in zh / ru / uk, and every sentence the main process says read back in each language (renderer/mainsaid.js).
      - name: Verify translations
        run: npm run test:i18n

      # A restore refused while work is open; the stop guard in front of every node stop, restart and quit (main/inflight.js).
      - name: Verify restore and in-flight guards
        run: node --test scripts/restore-test.cjs scripts/inflight-test.cjs

      # Keets chat: the wire schema, the file transfer port and the peer-string caps (as released 0.18.182).
      - name: Verify chat
        run: npm run test:chat

      # Engine parity + fund-safety gate. main/pandapools/*.js is copied verbatim from the pandapools-mds
      # MiniDapp; that donor repo is not checked out here, so this verifies the COMMITTED digest manifest rather
      # than the donor tree (scripts/pandapools-parity-check.cjs does the donor comparison locally, before a
      # release). Runs on all three matrix legs, so it also catches line-ending corruption of the copied files.
      # Placed BEFORE the build so a drifted engine can never produce an installer.
      - name: Verify PandaPools engine parity + recovery
        run: npm run test:pandapools

      # The same gate for the Dexicon engine: main/dexicon/{lib,crypto,vendor,resting}/ is copied verbatim from the
      # Dexicon MiniDapp (not checked out here), so this verifies the committed digest manifest
      # (scripts/dexicon-parity-check.cjs does the donor comparison locally).
      - name: Verify Dexicon engine parity + host (mock node, no network)
        run: npm run test:dexicon

      # The donor-free halves of the other suites. The parity check in test:atomix diffs against
      # donor repos that CI does not check out, but the units and gates below need nothing external — and they
      # cover fund-safety surfaces (the ETH RPC SSRF allowlist is 136 of these checks). Leaving them out meant
      # a regression that reopened that allowlist could ship three installers with nothing going red.
      - name: Verify ETH wallet guards
        run: npm run test:ethwallet

      # NOT gate:atomix — the S1/S2 gates boot the engine against a live node the caller must name
      # (scripts/test-node.cjs: AX_TEST_NODE_RPC + AX_TEST_NODE_I_OWN_THIS=yes; no name, address or port of any
      # node is written in this repo). There is no such node here, so they stay a local step. atomix-unit is
      # hermetic since 0.18.140: its engine boots on a mock node and the suite fails if anything leaves the process.
      - name: Verify AtomiX glue
        run: node scripts/atomix-unit.js

      # The committed digest manifest of the files copied verbatim into main/atomix/ (its donor is not checked out
      # here; atomix-parity-check.sh compares against it locally). A stray file beside them fails too.
      - name: Verify AtomiX copies against their manifest
        run: npm run test:atomix-manifest

      - name: Verify terminal autocomplete
        run: npm run test:termcomplete

      # The shell: six tabs, tray, overflow menu, and the block time read from the node's Java date (no donor repo needed).
      - name: Verify shell
        run: npm run test:shell
      # The Pandamonium flavour's own icons (build-pandamonium/icon.*, every size) and that the released build keeps build/icon.*.
      - name: Verify flavour build and icons
        run: npm run test:flavor
      - name: Wallet money paths and History (send, split, consolidate, receive commands pinned)
        run: npm run test:wallet
      - name: Tray apps (money calls of ETH Wallet, Vestr, miniMall and Web Wallet pinned; Terminal, Logs, Freeze; KeyUses, Explorer, Entropy)
        run: npm run test:apps

      # The Parlons Node jar is never in git: the newest node-v* release of eurobuddha/maxima, checksum-verified.
      - name: Fetch parlons-node.jar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-parlons-node-jar.sh

      # The keets sidecar's node_modules are never in git: exact-pinned install from the committed lockfile.
      - name: Install keets sidecar deps
        shell: bash
        run: bash scripts/fetch-keets-sidecar.sh

      - name: Build installer
        shell: bash
        run: npx electron-builder ${{ matrix.ebflag }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minimacore-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform != 'mac'
        uses: softprops/action-gh-release@v2
        with:
          # Preserve reviewed/notarized assets uploaded before a tag build finishes.
          overwrite_files: false
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
